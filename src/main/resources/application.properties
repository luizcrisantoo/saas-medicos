# Fase 2. Valores sensiveis so pelo ambiente (spec, secao 3.3); nada de senha aqui.
spring.application.name=saas-agenda
spring.main.banner-mode=off

# Processo (F7, E-09): SAAS_PROCESSO=web (padrao) ou jobs. Cada processo so le as proprias
# credenciais: web em application-web.properties, jobs em application-jobs.properties.
spring.profiles.active=${SAAS_PROCESSO:web}

# A aplicacao nao migra o banco (ADR-0027).
spring.flyway.enabled=false
