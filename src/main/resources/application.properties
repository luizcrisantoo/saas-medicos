# Fase 2, F6. Valores sensiveis so pelo ambiente (spec, secao 3.3); nada de senha aqui.
spring.application.name=saas-agenda
spring.main.banner-mode=off

# A aplicacao nao migra o banco (ADR-0027).
spring.flyway.enabled=false

# saas_app: pool Hikari padrao (SPRING_DATASOURCE_URL/USERNAME/PASSWORD).
spring.datasource.hikari.pool-name=saas-app
# saas_auth: pool proprio, so para sessao_equipe_abre (ADR-0024).
saas.db.auth.url=${SAAS_DB_AUTH_URL}
saas.db.auth.username=${SAAS_DB_AUTH_USERNAME}
saas.db.auth.password=${SAAS_DB_AUTH_PASSWORD}

# Cognito como resource server: chaves so da JWKS configurada.
saas.auth.issuer=${SAAS_AUTH_ISSUER}
saas.auth.jwks-uri=${SAAS_AUTH_JWKS_URI}
saas.auth.client-ids=${SAAS_AUTH_CLIENT_IDS}

# Erros sem detalhe interno (ADR-0026, item 3).
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
