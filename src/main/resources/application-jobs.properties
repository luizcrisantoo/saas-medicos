# Processo de jobs (SAAS_PROCESSO=jobs; E-09, ADR-0024). So SAAS_DB_JOBS_*: sem servidor HTTP,
# sem pool saas_app (SPRING_DATASOURCE_*), sem saas_auth e sem configuracao do Cognito.
spring.main.web-application-type=none
spring.main.keep-alive=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

saas.db.jobs.url=${SAAS_DB_JOBS_URL}
saas.db.jobs.username=${SAAS_DB_JOBS_USERNAME}
saas.db.jobs.password=${SAAS_DB_JOBS_PASSWORD}

# Pool e batimento do processo de jobs (nomeados; o padrao vale sem nada no ambiente).
# saas.jobs.pool.maximo: conexoes saas_jobs no maximo, 1..10, padrao 2 (uma para a acao em curso
# e uma para o batimento). saas.jobs.batimento-segundos: intervalo da conferencia da conexao sem SQL
# de aplicacao (Connection.isValid), 5..300 s, padrao 30. Fora das faixas a partida falha.
saas.jobs.pool.maximo=2
saas.jobs.batimento-segundos=30
