# Processo de jobs (SAAS_PROCESSO=jobs; E-09, ADR-0024). So SAAS_DB_JOBS_*: sem servidor HTTP,
# sem pool saas_app (SPRING_DATASOURCE_*), sem saas_auth e sem configuracao do Cognito.
spring.main.web-application-type=none
spring.main.keep-alive=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

saas.db.jobs.url=${SAAS_DB_JOBS_URL}
saas.db.jobs.username=${SAAS_DB_JOBS_USERNAME}
saas.db.jobs.password=${SAAS_DB_JOBS_PASSWORD}
