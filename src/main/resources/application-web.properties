# Processo web (SAAS_PROCESSO=web). Nunca le SAAS_DB_JOBS_* (E-09; spec, secao 3.3).

# saas_app: pool Hikari padrao (SPRING_DATASOURCE_URL/USERNAME/PASSWORD). O contexto da
# requisicao (sessao, clinica, papel) entra so por set_config(..., ?, true) dentro da transacao.
spring.datasource.hikari.pool-name=saas-app
# O pool saas_app e fechado por padrao: so aceita SQL pelo executor do ContextoBanco (I-20).
# A saude do banco vem do indicador 'banco' (Connection.isValid), nao do indicador padrao 'db'.
management.health.db.enabled=false
# saas_auth: pool proprio, so para sessao_equipe_abre (ADR-0024).
saas.db.auth.url=${SAAS_DB_AUTH_URL}
saas.db.auth.username=${SAAS_DB_AUTH_USERNAME}
saas.db.auth.password=${SAAS_DB_AUTH_PASSWORD}

# Cognito como resource server: chaves so da JWKS configurada.
saas.auth.issuer=${SAAS_AUTH_ISSUER}
saas.auth.jwks-uri=${SAAS_AUTH_JWKS_URI}
saas.auth.client-ids=${SAAS_AUTH_CLIENT_IDS}

# Paginacao de GET /api/auditoria (?limite=N&depoisDe=<id>, cabecalho X-Proxima-Pagina).
# padrao: itens sem ?limite (padrao 100); teto: maior pagina aceita, pedido acima e reduzido a ele
# (padrao 500, nunca acima de 1000). Fora de 1 <= padrao <= teto <= 1000 a partida falha.
saas.auditoria.pagina.padrao=100
saas.auditoria.pagina.teto=500

# Anexos (F8; ADR-0010): bucket privado do ambiente, chave KMS do SSE-KMS e regiao (so sa-east-1).
# Credenciais AWS pela cadeia padrao do SDK (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY no contrato;
# papel da tarefa em producao). Sem bucket e sem chave, as rotas de anexo respondem 503; configuracao
# parcial, regiao diferente ou validade fora de 1..300 s derrubam a partida.
saas.s3.bucket=${SAAS_S3_BUCKET:}
saas.s3.kms-key-id=${SAAS_S3_KMS_KEY_ID:}
saas.s3.regiao=${AWS_REGION:}
saas.s3.validade-segundos=300
# O SDK nunca loga requisicao assinada (URL, cabecalhos ou credencial).
logging.level.software.amazon.awssdk=WARN
logging.level.software.amazon.awssdk.request=OFF
logging.level.org.apache.http.wire=OFF

# Erros sem detalhe interno (ADR-0026, item 3).
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
