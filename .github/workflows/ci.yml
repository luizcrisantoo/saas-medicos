# Pipeline de pull request (briefing, "Pipeline e cadeia de suprimentos"; spec da Fase 2, 3.5).
# Toda verificacao abaixo e obrigatoria para o merge na branch principal (protecao da
# branch: passo manual do Luiz quando houver GitHub remoto, spec secao 7, P6).
# Cadeia de suprimentos (ADR-0040, item 6): toda action fixada pelo sha completo do commit
# (versao em comentario); permissoes minimas por job, nada no nivel do workflow; nenhum job
# com pull-requests: write; contents: write so no job "dependencias-envio", justificado la.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: build e testes (./gradlew build)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Testes (unitarios, Modulith, Testcontainers com PostgreSQL 16, guarda de migracao)
        run: ./gradlew build --no-daemon
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  # A guarda que roda aqui nao vem do PR (ADR-0040, item 8): scripts/ci (guarda e lista de
  # tabelas sensiveis) sai de um checkout separado do commit da branch base, em .guarda-base/,
  # e confere as migracoes e as aprovacoes do PR (checkout padrao). Um PR que afrouxa a guarda
  # ou reclassifica uma tabela so passa a valer depois de mergeado (com revisao do dono).
  # Em push na principal, a base e o proprio commit (ja revisado no PR).
  guarda-migracao:
    name: guarda de migracao (R-07, R-08)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout do PR (migracoes e aprovacoes)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Checkout da branch base (guarda e lista de tabelas sensiveis)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .guarda-base
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Guarda da base sobre db/migration do PR
        run: .guarda-base/scripts/ci/guarda-migracao.sh src/main/resources/db/migration src/main/resources/db/aprovacoes.sha256
      - name: Guarda da base sobre db/reversao do PR
        run: .guarda-base/scripts/ci/guarda-migracao.sh src/main/resources/db/reversao src/main/resources/db/aprovacoes.sha256

  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      # security-events: write e exigido para enviar o SARIF do CodeQL; actions: read e
      # exigido pelo CodeQL em repositorio privado. Nenhum outro escopo.
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      - name: Compilacao para o CodeQL
        run: ./gradlew compileJava compileTestJava --no-daemon
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          category: /language:java-kotlin

  # Varredura de dependencias em tres jobs para que nenhum job que executa codigo do PR tenha
  # escopo de escrita: (1) gera o grafo com o Gradle do PR, so leitura; (2) envia o grafo a API
  # de envio de dependencias, que exige contents: write, sem checkout e sem executar codigo do
  # PR (so baixa o JSON do job 1); (3) revisa o PR contra o grafo, so leitura, sem comentario
  # no PR (sem pull-requests: write; o resultado fica no log e no status do job).
  dependencias-grafo:
    name: grafo de dependencias do Gradle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Gera o grafo e guarda como artefato (sem enviar)
        uses: gradle/actions/dependency-submission@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          dependency-graph: generate-and-upload

  dependencias-envio:
    name: envio do grafo de dependencias
    needs: dependencias-grafo
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Exigencia da API de envio de dependencias (dependency submission). Este job nao faz
      # checkout nem roda Gradle: so baixa o artefato do job anterior e o envia.
      contents: write
    steps:
      - name: Envia o grafo gerado pelo job anterior
        uses: gradle/actions/dependency-submission@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          dependency-graph: download-and-submit

  dependencias:
    name: varredura de dependencias vulneraveis
    needs: dependencias-envio
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Revisao de dependencias (falha com vulnerabilidade moderada ou pior)
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
          retry-on-snapshot-warnings: true

  segredos:
    name: varredura de segredos (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSAO: 8.21.2
      GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instala gitleaks fixado (versao e sha256 conferidos)
        run: |
          arquivo="gitleaks_${GITLEAKS_VERSAO}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$arquivo" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSAO}/$arquivo"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$arquivo" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$arquivo" -C "$RUNNER_TEMP" gitleaks
      - name: Varre o historico do git e a arvore com a configuracao do repositorio
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --exit-code 1 .
          "$RUNNER_TEMP/gitleaks" dir --config .gitleaks.toml --redact --no-banner --exit-code 1 .
