# Pipeline de pull request (briefing, "Pipeline e cadeia de suprimentos"; spec da Fase 2, 3.5).
# Toda verificacao abaixo e obrigatoria para o merge na branch principal (protecao da
# branch: passo manual do Luiz quando houver GitHub remoto, spec secao 7, P6).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: build e testes (./gradlew build)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes (unitarios, Modulith, Testcontainers com PostgreSQL 16, guarda de migracao)
        run: ./gradlew build --no-daemon
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  guarda-migracao:
    name: guarda de migracao (R-07, R-08)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guarda sobre db/migration
        run: scripts/ci/guarda-migracao.sh src/main/resources/db/migration src/main/resources/db/aprovacoes.sha256
      - name: Guarda sobre db/reversao
        run: scripts/ci/guarda-migracao.sh src/main/resources/db/reversao src/main/resources/db/aprovacoes.sha256

  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      - name: Compilacao para o CodeQL
        run: ./gradlew compileJava compileTestJava --no-daemon
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin

  dependencias:
    name: varredura de dependencias vulneraveis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Grafo de dependencias do Gradle
        uses: gradle/actions/dependency-submission@v4
      - name: Revisao de dependencias (falha com vulnerabilidade moderada ou pior)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

  segredos:
    name: varredura de segredos (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSAO: 8.21.2
      GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instala gitleaks fixado (versao e sha256 conferidos)
        run: |
          arquivo="gitleaks_${GITLEAKS_VERSAO}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$arquivo" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSAO}/$arquivo"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$arquivo" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$arquivo" -C "$RUNNER_TEMP" gitleaks
      - name: Varre o historico do git e a arvore com a configuracao do repositorio
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --exit-code 1 .
          "$RUNNER_TEMP/gitleaks" dir --config .gitleaks.toml --redact --no-banner --exit-code 1 .
